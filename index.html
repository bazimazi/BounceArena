<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bounce Arena</title>
    <meta name="description" content="A physics brawler where speed is power. Build momentum, ram rival balls off a floating arena, and survive the heat. Free in your browser, no install." />
    <meta name="theme-color" content="#050a10" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bounce Arena" />
    <meta property="og:title" content="Bounce Arena" />
    <meta property="og:description" content="Speed is power. Ram rival balls off a floating arena." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body data-mode="menu">
    <canvas id="view" aria-label="Bounce Arena"></canvas>
    <div id="scrim"></div>
    <div id="ui"></div>
    <div id="hud" hidden></div>
    <div id="wipe" aria-hidden="true"></div>
    <div id="touch" hidden>
      <div id="stick-zone" aria-label="Steer: touch anywhere on the left"></div>
      <div id="stick" class="stick" aria-hidden="true"><div id="knob" class="knob"></div></div>
      <button id="btn-brake" type="button">BRAKE</button>
      <div class="touch-actions">
        <button id="btn-ability" type="button">ABILITY</button>
        <button id="btn-dash" type="button">DASH</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
